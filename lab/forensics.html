<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Forensics Workbench</title>
<!-- Self-contained styles so the file can travel without external CSS assets. -->
<style>
/* Base component styles shared across panes, actions, and utility states. */
:root {
  --surface: #ffffff;
  --surface-soft: #f6f6f6;
  --border: #cfcfcf;
  --ink: #1f1f1f;
  --ink-soft: #4a4a4a;
  --accent: #0f766e;
}

html,
body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--ink);
}

.app-shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #ececec 0%, #f8f8f8 100%);
}

.app-header,
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 8px;
  padding: 8px;
  overflow: auto;
}

.column {
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
}

.pane-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #ffffff;
  background: #383838;
  padding: 6px 8px;
}

.pane-action {
  cursor: pointer;
  font-size: 10px;
  border: 1px solid #707070;
  background: #505050;
  color: #ffffff;
  padding: 2px 6px;
}

.pane-edit,
.pane-output,
.pane-console {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  white-space: pre-wrap;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
}

.pane-edit[contenteditable="true"],
.pane-output[contenteditable="true"] {
  outline: none;
}

.pane-console {
  background: var(--surface-soft);
  white-space: pre;
  font-size: 11px;
}

.pane-summary {
  flex: 0 0 auto;
  padding: 6px 8px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  background: #f0f0f0;
  color: var(--ink-soft);
}

.is-hidden {
  display: none;
}

.token-valid {
  color: #2e7d32;
  font-weight: 700;
}

.token-warning {
  color: #ef6c00;
  font-weight: 700;
}

.token-fail {
  color: #c62828;
  font-weight: 700;
}

/* Layout-specific styles for the URL forensics workspace and converted preview sidebar. */
.content-shell {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
}

.merged-workspace {
  display: flex;
  flex-wrap: nowrap;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  width: auto;
  overflow: hidden;
  gap: 8px;
  align-items: stretch;
  padding: 0;
}

.app-header h3 {
  margin: 0 16px 0 0;
  font-size: 16px;
}

.app-header {
  flex-wrap: wrap;
}

.column {
  min-width: 0;
  height: 100%;
  transition: flex-basis 0.2s ease, width 0.2s ease;
}

.column.is-expanded {
  flex: 1 1 auto;
  width: auto;
}

.column.is-active {
  box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.45);
}

.column.is-active .pane-title {
  background: #0f766e;
}

.column.is-collapsed-horizontal {
  flex: 0 0 52px;
  width: 52px;
  align-self: stretch;
  overflow: hidden;
}

.column.is-collapsed-horizontal .pane-title {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  justify-content: flex-start;
  align-items: center;
  height: 100%;
  min-height: 100%;
  padding: 8px 6px;
  gap: 8px;
  cursor: pointer;
}

.column.is-collapsed-horizontal .pane-title .pane-action {
  writing-mode: horizontal-tb;
  transform: rotate(90deg);
  transform-origin: center;
  font-size: 9px;
  padding: 2px 4px;
}

.column.is-collapsed-horizontal .pane-edit,
.column.is-collapsed-horizontal .pane-output,
.column.is-collapsed-horizontal .pane-console,
.column.is-collapsed-horizontal .pane-summary {
  display: none;
}

.sidebar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-panel {
  display: flex;
  flex-direction: column;
  flex: 0 0 0;
  width: 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--surface);
  border: 0 solid var(--border);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
  opacity: 0;
  transition: flex-basis 0.22s ease, width 0.22s ease, opacity 0.22s ease, border-width 0.22s ease;
}

.sidebar-panel.is-open {
  flex-basis: min(420px, 34vw);
  width: min(420px, 34vw);
  border-width: 1px;
  opacity: 1;
}

#editor,
#rewrittenPane,
#finalPane,
#digestPane {
  white-space: pre-wrap;
}

#editor {
  white-space: normal;
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  background: #ffffff;
}

#editor p,
#editor div,
#editor ul,
#editor ol,
#editor blockquote,
#editor table,
#editor pre {
  margin-top: 0;
  margin-bottom: 0.85em;
}

#editor img,
#editor table {
  max-width: 100%;
}

#editor img {
  height: auto;
}

#editor table {
  border-collapse: collapse;
}

#editor td,
#editor th {
  border: 1px solid #d6d6d6;
  padding: 4px 6px;
}

#editor blockquote {
  padding-left: 12px;
  border-left: 3px solid #d0d0d0;
  color: #4a4a4a;
}

#editor pre {
  white-space: pre-wrap;
  padding: 8px;
  border-radius: 8px;
  background: #f6f6f6;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
}

#editor a {
  color: #0f766e;
}

#finalPane a,
#digestPane a,
#rewrittenPane a,
#diagnosticsPane a,
#resolvedPane a,
#detectedPane a {
  color: #0f766e;
  text-decoration: none;
}

#finalPane a:hover,
#digestPane a:hover,
#rewrittenPane a:hover,
#diagnosticsPane a:hover,
#resolvedPane a:hover,
#detectedPane a:hover {
  text-decoration: underline;
}

.inline-meta {
  color: #555;
  font-size: 11px;
}

#debugPane {
  max-height: 28vh;
  border-top: 1px solid var(--border);
  background: #f4f4f4;
}

@media (max-width: 1100px) {
  .content-shell {
    flex-direction: column;
    gap: 6px;
    padding: 6px;
  }

  .merged-workspace {
    gap: 6px;
  }

  .sidebar-panel {
    width: 100%;
  }

  .sidebar-panel.is-open {
    flex-basis: min(40vh, 320px);
    width: 100%;
  }

  .column.is-collapsed-horizontal {
    flex-basis: 44px;
    width: 44px;
  }
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- The header keeps the same button IDs used by the inline controller module below. -->
  <header class="app-header">
    <h3>URL Forensics Workbench</h3>
    <button id="runBtn" class="pane-action" type="button">Run Pipeline</button>
    <button id="useRewrittenBtn" class="pane-action" type="button">Show Converted Panel</button>
    <button id="copyFinalBtn" class="pane-action" type="button">Copy Final URLs</button>
    <button id="copyDigestBtn" class="pane-action" type="button">Copy Digest HTML</button>
    <button id="toggleDebugBtn" class="pane-action" type="button">Toggle Debug</button>
  </header>

  <!-- The workspace itself is rendered from configuration so the repeated pane structure stays modular. -->
  <div id="contentShell" class="content-shell">
    <main id="workspace" class="workspace merged-workspace" aria-label="URL forensics analysis workspace"></main>
  </div>

  <!-- Hidden by default; this becomes visible when the analyst toggles debug output. -->
  <div id="debugPane" class="pane-console is-hidden"></div>
</div>

<!-- Shared template for the main workspace columns. -->
<template id="workspacePaneTemplate">
  <section class="column">
    <div class="pane-title">
      <span data-role="title"></span>
      <button class="pane-action" type="button" data-role="copyButton">Copy</button>
    </div>
    <div data-role="content"></div>
    <div data-role="summary" class="pane-summary"></div>
  </section>
</template>

<!-- Separate template for the converted preview sidebar because it includes a close action. -->
<template id="sidebarPaneTemplate">
  <aside class="sidebar-panel" aria-hidden="true" data-default-open="true">
    <div class="pane-title">
      <span data-role="title"></span>
      <div class="sidebar-actions">
        <button id="closeRewrittenBtn" class="pane-action" type="button">Hide</button>
        <button class="pane-action" type="button" data-role="copyButton">Copy</button>
      </div>
    </div>
    <div data-role="content"></div>
    <div data-role="summary" class="pane-summary"></div>
  </aside>
</template>

<script src="./firefox-extension/debug.js"></script>

<!-- Layout module: builds the repeated panes from configuration inside this single file. -->
<script>
(function buildForensicsLayout() {
  "use strict";

  const debugApi = typeof globalThis !== "undefined" ? globalThis.mergedLinkLabDebug : null;
  if (debugApi && typeof debugApi.configure === "function") {
    debugApi.configure({ context: "forensics-inline-layout", module: "layout" });
    debugApi.runtime("forensics inline layout initialization started");
  }

  /*
    This layout builder keeps the page modular even though everything now lives in one HTML file.
    The configuration objects below are the single source of truth for pane titles, IDs, copy targets,
    and which surfaces should be editable. The existing app controller still works because those IDs
    and classes remain exactly the same after rendering.
  */
  const WORKSPACE_PANES = [
    {
      title: "Input Editor",
      contentId: "editor",
      contentClass: "pane-edit",
      summaryId: "inputSummary",
      copyTargetId: "editor",
      isEditable: true,
      defaultExpanded: true
    },
    {
      title: "Detected URLs",
      contentId: "detectedPane",
      contentClass: "pane-console",
      summaryId: "detectSummary",
      copyTargetId: "detectedPane"
    },
    {
      title: "Normalization and Resolve",
      contentId: "resolvedPane",
      contentClass: "pane-console",
      summaryId: "resolveSummary",
      copyTargetId: "resolvedPane"
    },
    {
      title: "Final URL List",
      contentId: "finalPane",
      contentClass: "pane-output",
      summaryId: "finalSummary",
      copyTargetId: "finalPane",
      isEditable: true
    },
    {
      title: "Digest Output",
      contentId: "digestPane",
      contentClass: "pane-output",
      summaryId: "digestSummary",
      copyTargetId: "digestPane",
      isEditable: true
    },
    {
      title: "Diagnostics",
      contentId: "diagnosticsPane",
      contentClass: "pane-console",
      summaryId: "diagnosticsSummary",
      copyTargetId: "diagnosticsPane"
    }
  ];

  const SIDEBAR_PANE = {
    id: "rewrittenSidebar",
    title: "Converted Panel",
    contentId: "rewrittenPane",
    contentClass: "pane-output",
    summaryId: "rewrittenSummary",
    copyTargetId: "rewrittenPane",
    isEditable: true
  };

  const contentShell = document.getElementById("contentShell");
  const workspace = document.getElementById("workspace");
  const workspacePaneTemplate = document.getElementById("workspacePaneTemplate");
  const sidebarPaneTemplate = document.getElementById("sidebarPaneTemplate");

  if (!contentShell || !workspace || !workspacePaneTemplate || !sidebarPaneTemplate) {
    if (debugApi) {
      debugApi.error("forensics inline layout initialization aborted: required template missing", {
        hasContentShell: !!contentShell,
        hasWorkspace: !!workspace,
        hasWorkspacePaneTemplate: !!workspacePaneTemplate,
        hasSidebarPaneTemplate: !!sidebarPaneTemplate
      });
    }
    return;
  }

  // Creates one pane body with the exact ID and class hooks expected by the controller code.
  function createPaneContentElement(config) {
    const contentElement = document.createElement("div");
    contentElement.id = config.contentId;
    contentElement.className = config.contentClass;
    contentElement.setAttribute("aria-label", config.title);

    if (config.isEditable) {
      contentElement.setAttribute("contenteditable", "true");
    }

    return contentElement;
  }

  // Applies the shared title, copy target, summary ID, and content surface for any pane template.
  function applySharedPaneMetadata(rootElement, config) {
    const titleElement = rootElement.querySelector('[data-role="title"]');
    const copyButton = rootElement.querySelector('[data-role="copyButton"]');
    const contentPlaceholder = rootElement.querySelector('[data-role="content"]');
    const summaryElement = rootElement.querySelector('[data-role="summary"]');

    if (titleElement) {
      titleElement.textContent = config.title;
    }

    if (copyButton) {
      copyButton.setAttribute("data-copy", config.copyTargetId);
    }

    if (summaryElement) {
      summaryElement.id = config.summaryId;
    }

    if (contentPlaceholder) {
      contentPlaceholder.replaceWith(createPaneContentElement(config));
    }
  }

  // Builds one main workspace column from configuration so repeated markup stays out of the HTML body.
  function buildWorkspacePane(config) {
    const paneFragment = workspacePaneTemplate.content.cloneNode(true);
    const column = paneFragment.querySelector(".column");

    applySharedPaneMetadata(paneFragment, config);

    if (column && config.defaultExpanded) {
      column.setAttribute("data-default-expanded", "true");
    }

    return column;
  }

  // Builds the sidebar separately because it includes a close action in addition to the copy button.
  function buildSidebarPane(config) {
    const paneFragment = sidebarPaneTemplate.content.cloneNode(true);
    const sidebar = paneFragment.querySelector(".sidebar-panel");

    applySharedPaneMetadata(paneFragment, config);

    if (sidebar) {
      sidebar.id = config.id;
    }

    return sidebar;
  }

  // Render every workspace pane in a single batch so the DOM is clean before the app controller starts.
  function renderWorkspacePanes() {
    const paneElements = WORKSPACE_PANES.map(buildWorkspacePane).filter(Boolean);
    workspace.replaceChildren(...paneElements);
  }

  // Insert the converted preview sidebar after the main workspace to preserve the existing flex layout.
  function renderSidebarPane() {
    const sidebarElement = buildSidebarPane(SIDEBAR_PANE);

    if (!sidebarElement) {
      return;
    }

    const existingSidebar = document.getElementById(SIDEBAR_PANE.id);
    if (existingSidebar) {
      existingSidebar.remove();
    }

    contentShell.appendChild(sidebarElement);
  }

  // Initialize the layout renderer by creating the configured panes before the controller starts.
  function initializeLayout() {
    renderWorkspacePanes();
    renderSidebarPane();
    if (debugApi) {
      debugApi.runtime("forensics inline layout initialized", {
        workspacePaneCount: WORKSPACE_PANES.length,
        hasSidebar: !!document.getElementById(SIDEBAR_PANE.id)
      });
    }
  }

  initializeLayout();
})();
</script>

<!-- Utility module: lightweight helpers for DOM lookup, copying, visibility, and shared pipeline helpers. -->
<script>
(function attachComponentKit(globalScope) {
  "use strict";

  function getComponentDebug() {
    return globalScope && globalScope.mergedLinkLabDebug ? globalScope.mergedLinkLabDebug : null;
  }

  // Resolve either an element ID string or a direct DOM node into a usable element reference.
  function resolveElementTarget(target) {
    if (typeof target === "string") {
      return document.getElementById(target);
    }

    return target || null;
  }

  const componentKit = {
    byId(id) {
      return document.getElementById(id);
    },

    resolveElementTarget: resolveElementTarget,

    renderCount(target, label, count) {
      const targetElement = resolveElementTarget(target);
      const debugApi = getComponentDebug();
      if (!targetElement) {
        if (debugApi) {
          debugApi.conditional("forensics component kit renderCount skipped: target missing", { label: label });
        }
        return;
      }
      targetElement.textContent = String(label) + ": " + String(count);
      if (debugApi) {
        debugApi.variable("forensics component kit count rendered", { label: label, count: count });
      }
    },

    setVisible(target, shouldBeVisible) {
      const targetElement = resolveElementTarget(target);
      const debugApi = getComponentDebug();
      if (!targetElement) {
        if (debugApi) {
          debugApi.conditional("forensics component kit setVisible skipped: target missing");
        }
        return;
      }
      targetElement.classList.toggle("is-hidden", !shouldBeVisible);
      if (debugApi) {
        debugApi.ui("forensics component kit visibility changed", { shouldBeVisible: !!shouldBeVisible });
      }
    },

    toggle(target) {
      const targetElement = resolveElementTarget(target);
      const debugApi = getComponentDebug();
      if (!targetElement) {
        if (debugApi) {
          debugApi.conditional("forensics component kit toggle skipped: target missing");
        }
        return;
      }
      targetElement.classList.toggle("is-hidden");
      if (debugApi) {
        debugApi.ui("forensics component kit visibility toggled", { isHidden: targetElement.classList.contains("is-hidden") });
      }
    },

    bindLiveInput(target, handler) {
      const targetElement = resolveElementTarget(target);
      const debugApi = getComponentDebug();
      if (!targetElement || typeof handler !== "function") {
        if (debugApi) {
          debugApi.conditional("forensics component kit bindLiveInput skipped", {
            hasTarget: !!targetElement,
            hasHandler: typeof handler === "function"
          });
        }
        return;
      }
      targetElement.addEventListener("input", handler);
      if (debugApi) {
        debugApi.ui("forensics component kit live input bound");
      }
    },

    async copyFromElement(source) {
      const debugApi = getComponentDebug();
      if (debugApi) {
        debugApi.functionIn("forensics.componentKit.copyFromElement");
      }
      const sourceElement = resolveElementTarget(source);
      if (!sourceElement || !navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
        if (debugApi) {
          debugApi.conditional("forensics component kit plain copy skipped", {
            hasSource: !!sourceElement,
            hasClipboard: !!navigator.clipboard
          });
          debugApi.functionOut("forensics.componentKit.copyFromElement", { copied: false });
        }
        return false;
      }

      await navigator.clipboard.writeText(sourceElement.innerText || "");
      if (debugApi) {
        debugApi.variable("forensics component kit plain copy text length assigned", {
          textLength: sourceElement.innerText ? sourceElement.innerText.length : 0
        });
        debugApi.functionOut("forensics.componentKit.copyFromElement", { copied: true });
      }
      return true;
    },

    async copyRichFromElement(source) {
      const debugApi = getComponentDebug();
      if (debugApi) {
        debugApi.functionIn("forensics.componentKit.copyRichFromElement");
      }
      const sourceElement = resolveElementTarget(source);

      if (
        !sourceElement ||
        !navigator.clipboard ||
        typeof navigator.clipboard.write !== "function" ||
        typeof ClipboardItem === "undefined"
      ) {
        if (debugApi) {
          debugApi.conditional("forensics component kit rich copy skipped", {
            hasSource: !!sourceElement,
            hasClipboard: !!navigator.clipboard,
            hasClipboardItem: typeof ClipboardItem !== "undefined"
          });
          debugApi.functionOut("forensics.componentKit.copyRichFromElement", { copied: false });
        }
        return false;
      }

      const clipboardItem = new ClipboardItem({
        "text/html": new Blob([sourceElement.innerHTML || ""], { type: "text/html" }),
        "text/plain": new Blob([sourceElement.innerText || ""], { type: "text/plain" })
      });

      await navigator.clipboard.write([clipboardItem]);
      if (debugApi) {
        debugApi.variable("forensics component kit rich copy source lengths assigned", {
          htmlLength: sourceElement.innerHTML ? sourceElement.innerHTML.length : 0,
          textLength: sourceElement.innerText ? sourceElement.innerText.length : 0
        });
        debugApi.functionOut("forensics.componentKit.copyRichFromElement", { copied: true });
      }
      return true;
    },

    runPipeline(stages, inputValue, context) {
      const debugApi = getComponentDebug();
      if (debugApi) {
        debugApi.functionIn("forensics.componentKit.runPipeline", {
          stageCount: stages ? stages.length : 0,
          inputLength: typeof inputValue === "string" ? inputValue.length : null
        });
      }
      const pipelineContext = context || {};
      let currentValue = inputValue;

      (stages || []).forEach(function runStage(stage, index) {
        try {
          if (debugApi) {
            debugApi.loop("forensics component kit running pipeline stage", {
              index: index,
              stageName: stage && stage.name ? stage.name : "anonymousStage"
            });
          }
          currentValue = stage(currentValue, pipelineContext);
        } catch (error) {
          const stageName = stage.name || "anonymousStage";
          if (!pipelineContext.errors) pipelineContext.errors = [];
          pipelineContext.errors.push(stageName + ": " + error.message);
          if (debugApi) {
            debugApi.error("forensics component kit pipeline stage failed", {
              stageName: stageName,
              message: error && error.message ? error.message : "unknown error"
            });
          }
        }
      });

      if (debugApi) {
        debugApi.functionOut("forensics.componentKit.runPipeline", {
          errorCount: pipelineContext.errors ? pipelineContext.errors.length : 0,
          outputLength: typeof currentValue === "string" ? currentValue.length : null
        });
      }
      return {
        value: currentValue,
        context: pipelineContext
      };
    }
  };

  globalScope.ComponentKit = componentKit;
})(window);
</script>

<!-- Analysis module: detects, unwraps, normalizes, rewrites, and summarizes URLs. -->
<script>
(function attachMergedLinkLabPipeline(globalScope, createPipelineApi) {
  "use strict";

  const pipelineApi = createPipelineApi(globalScope);

  if (typeof module !== "undefined" && module.exports) {
    module.exports = pipelineApi;
  }

  if (globalScope) {
    globalScope.MergedLinkLabPipeline = pipelineApi;
  }
})(
  typeof globalThis !== "undefined" ? globalThis : this,
  // Build the pipeline module and return the public analysis API used by the page.
  function createMergedLinkLabPipelineApi(globalScope) {
    "use strict";

    const debugApi = globalScope && globalScope.mergedLinkLabDebug ? globalScope.mergedLinkLabDebug : null;
    if (debugApi && typeof debugApi.configure === "function") {
      debugApi.configure({ context: "forensics-inline-pipeline", module: "pipeline" });
      debugApi.runtime("forensics inline pipeline initialization started");
    }

    // Regular expressions are grouped here so every pipeline stage shares the same token rules.
    const regularExpressions = {
      urlToken: /https?:\/\/[^\s<>"']+/gi,
      trailingUrlPunctuation: /[)\]\.,>]+$/,
      wrappedNoise: /[<>]/g,
      lightweightWhitespaceNoise: /[\u2000-\u200F\u2028-\u202F]/g,
      heavyWhitespaceNoise: /[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180E\u2000-\u200F\u2028-\u202F\u2060-\u206F\uFEFF]/g,
      protectedMarkupTag: /^(A|SCRIPT|STYLE|NOSCRIPT|TEXTAREA|PRE|CODE)$/i,
      embeddedTrackingParameter:
        /[?&](?:url|u|target|redirect|redirect_url|dest|destination|next|forward|goto|continue|to|href|link|data)=([^&]+)/gi
    };

    const preferredTrackingParameterNames = [
      "url",
      "u",
      "target",
      "redirect",
      "redirect_url",
      "dest",
      "destination",
      "next",
      "forward",
      "goto",
      "continue",
      "to",
      "href",
      "link",
      "data"
    ];

    const trackingHostKeywords = [
      "list-manage",
      "rs6.net",
      "ccsend.com",
      "kajabimail",
      "mail",
      "tracking",
      "redirect",
      "click"
    ];

    // Convert nullable or non-string values into a safe string for downstream helpers.
    function convertValueToString(value) {

    }

    DOM.editor.focus();

    // Use the built-in rich-text insertion path when available and fall back to direct range manipulation otherwise.
    if (document.queryCommandSupported && document.queryCommandSupported("insertHTML")) {
      document.execCommand("insertHTML", false, htmlMarkup);
      return;
    }

    const selection = window.getSelection();
    if (!selection || !selection.rangeCount) {
      DOM.editor.innerHTML += htmlMarkup;
      return;
    }

    const range = selection.getRangeAt(0);
    range.deleteContents();

    const fragment = range.createContextualFragment(htmlMarkup);
    const lastNode = fragment.lastChild;
    range.insertNode(fragment);

    if (lastNode) {
      range.setStartAfter(lastNode);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }
  }

  // Determine which pane should start expanded when the workspace loads.
  function getDefaultExpandedPaneIds() {
    const defaultExpandedColumn =
      DOM.columns.find(function findExpandedColumn(column) {
        return column && column.hasAttribute("data-default-expanded");
      }) ||
      DOM.columns.find(Boolean);
    const paneId = getColumnPaneId(defaultExpandedColumn);

    return paneId ? new Set([paneId]) : new Set();
  }

  const UIState = {
    expandedPaneIds: getDefaultExpandedPaneIds()
  };

  // Convert plain text into safe HTML with line breaks for pane rendering.
  function toRichText(text) {
    return mergedLinkLabPipeline.escapeHtml(text).replace(/\n/g, "<br>");
  }

  // Write escaped rich text into a target pane.
  function setRichText(targetElement, text) {
    if (!targetElement) {
      return;
    }

    targetElement.innerHTML = toRichText(text || "");
  }

  // The input payload preserves both plain text and rich HTML so the pipeline can choose the best detection path.
  function getInputPayload() {
    const rawText = DOM.editor ? DOM.editor.innerText || "" : "";
    const rawHtml = DOM.editor ? DOM.editor.innerHTML || "" : "";
    const preservedSourceHtml = DOM.editor && DOM.editor.dataset ? DOM.editor.dataset.sourceHtml || "" : "";
    const looksLikeHtmlSource =
      /<\s*html[\s>]/i.test(rawText) ||
      /<\s*body[\s>]/i.test(rawText) ||
      (/<[a-z][^>]*>/i.test(rawText) && /<\/[a-z][^>]*>/i.test(rawText));
    const richSourceHtml = isEditorRichMode() ? rawHtml : "";

    if (DOM.editor && DOM.editor.dataset && richSourceHtml) {
      DOM.editor.dataset.sourceHtml = richSourceHtml;
    }

    return {
      rawText: rawText,
      cleanedText: mergedLinkLabPipeline.cleanInputText(rawText),
      sourceHtml: looksLikeHtmlSource ? rawText : (richSourceHtml || preservedSourceHtml || "")
    };
  }

  // Render the raw detected URL list into its output pane.
  function renderDetected(items) {
    const lines = items.map(function mapItem(item) {
      return String(item.id) + ". " + item.original;
    });

    setRichText(DOM.detectedPane, lines.join("\n"));
    componentKit.renderCount(DOM.detectSummary, "DETECTED", items.length);
  }

  // Render normalization, resolution, and notes for each detected item.
  function renderResolved(items) {
    const lines = [];

    items.forEach(function addItemLines(item) {
      lines.push("SOURCE " + item.id + ": " + item.original);
      lines.push("NORMALIZED: " + item.normalized);
      lines.push("RESOLVED: " + (item.resolved.length ? item.resolved.join(" | ") : "(none)"));
      lines.push("VALID: " + (item.validResolved.length ? item.validResolved.join(" | ") : "(none)"));
      lines.push("NOTES: " + (item.notes.length ? item.notes.join(", ") : "(none)"));
      lines.push("");
    });

    setRichText(DOM.resolvedPane, lines.join("\n").trim());

    const resolvedCount = items.reduce(function addResolvedCount(total, item) {
      return total + item.resolved.length;
    }, 0);

    componentKit.renderCount(DOM.resolveSummary, "RESOLVED", resolvedCount);
  }

  // Render the final resolved URL list with compact host classification metadata.
  function renderFinal(items) {
    const finalUrls = mergedLinkLabPipeline.buildStandaloneFinalUrls(items);

    if (DOM.finalPane) {
      DOM.finalPane.innerHTML = finalUrls
        .map(function mapFinalUrl(url) {
          const host = mergedLinkLabPipeline.extractHost(url);
          const linkType = mergedLinkLabPipeline.classify(host);
          const originUrl = mergedLinkLabPipeline.extractOriginUrl(url);
          const linkLabel = originUrl + " (" + linkType + ")";

          return (
            '<a href="' +
            mergedLinkLabPipeline.escapeHtml(url) +
            '" target="_blank" rel="noopener noreferrer">' +
            mergedLinkLabPipeline.escapeHtml(linkLabel) +
            "</a>"
          );
        })
        .join("<br>");
    }

    componentKit.renderCount(DOM.finalSummary, "FINAL URLS", finalUrls.length);
    return finalUrls;
  }

  // Render the digest summary entries used for email-friendly output.
  function renderDigest(entries) {
    if (DOM.digestPane) {
      DOM.digestPane.innerHTML = entries
        .map(function mapDigestEntry(entry) {
          const safeTitle = mergedLinkLabPipeline.escapeHtml(entry.title);
          const safeHost = mergedLinkLabPipeline.escapeHtml(entry.host || "unknown-host");
          const safeType = mergedLinkLabPipeline.escapeHtml(entry.type || "destination");
          const safeHref = mergedLinkLabPipeline.escapeHtml(entry.url);

          return (
            safeTitle +
            ' (<a href="' +
            safeHref +
            '" target="_blank" rel="noopener noreferrer">' +
            safeHost +
            "</a> -> " +
            safeType +
            ")"
          );
        })
        .join("<br><br>");
    }

    componentKit.renderCount(DOM.digestSummary, "DIGEST ITEMS", entries.length);
  }

  // Render the converted preview panel from the current source markup.
  function renderRewrittenHtml(sourceMarkup) {
    const rewrittenResult = mergedLinkLabPipeline.rewriteHtmlForStandalonePreview(sourceMarkup);

    if (DOM.rewrittenPane) {
      DOM.rewrittenPane.innerHTML = rewrittenResult.html;
    }

    componentKit.renderCount(DOM.rewrittenSummary, "REWRITTEN URLS", rewrittenResult.count || 0);
  }

  // Render the diagnostics and debug views from the current pipeline state.
  function renderDiagnostics(items, finalUrls, digestEntries, errors, rawText) {
    const diagnostics = mergedLinkLabPipeline.buildDiagnostics(items, finalUrls, digestEntries, errors, rawText);

    setRichText(DOM.diagnosticsPane, diagnostics.lines.join("\n"));
    componentKit.renderCount(DOM.diagnosticsSummary, "DIAGNOSTICS", diagnostics.lines.length);

    const debugLines = [];
    items.forEach(function addDebugLines(item) {
      debugLines.push("ITEM " + item.id);
      debugLines.push("  ORIGINAL: " + item.original);
      debugLines.push("  NORMALIZED: " + item.normalized);
      debugLines.push("  RESOLVED: " + item.resolved.join(" | "));
      debugLines.push("  VALID: " + item.validResolved.join(" | "));
      debugLines.push("  NOTES: " + (item.notes.join(", ") || "(none)"));
    });

    setRichText(DOM.debugPane, debugLines.join("\n"));
  }

  // This is the main UI workflow: collect input, resolve URLs, render panes, and surface diagnostics.
  function runPipeline(options) {
    if (debugApi) {
      debugApi.functionIn("forensics-inline-ui.runPipeline", {
        writeCleanedInput: !!(options && options.writeCleanedInput)
      });
    }
    const optionBag = options || {};
    const shouldWriteCleanedInput = !!optionBag.writeCleanedInput;
    const payload = getInputPayload();
    const errors = [];
    let items = [];

    if (debugApi) {
      debugApi.variable("forensics inline UI input payload summary assigned", {
        rawTextLength: payload.rawText.length,
        cleanedTextLength: payload.cleanedText.length,
        sourceHtmlLength: payload.sourceHtml.length,
        mode: payload.sourceHtml ? "html" : "text"
      });
    }

    if (shouldWriteCleanedInput && DOM.editor && payload.cleanedText !== payload.rawText && !isEditorRichMode()) {
      setEditorPlainText(payload.cleanedText);
      if (debugApi) {
        debugApi.conditional("forensics inline cleaned input written back to editor", {
          rawTextLength: payload.rawText.length,
          cleanedTextLength: payload.cleanedText.length
        });
      }
    }

    componentKit.renderCount(
      DOM.inputSummary,
      "INPUT LINES",
      payload.cleanedText ? payload.cleanedText.split("\n").length : 0
    );

    // Detection and resolution are isolated so each stage can fail independently and still surface diagnostics.
    try {
      items = payload.sourceHtml
        ? mergedLinkLabPipeline.detectUrlsFromHtml(payload.sourceHtml)
        : mergedLinkLabPipeline.detectURLs(payload.cleanedText);
    } catch (error) {
      errors.push("stageDetect: " + error.message);
      if (debugApi) {
        debugApi.error("forensics inline UI detect stage failed", {
          message: error && error.message ? error.message : "unknown error"
        });
      }
    }

    try {
      mergedLinkLabPipeline.populateResolvedDataForItems(items);
    } catch (error) {
      errors.push("stageResolve: " + error.message);
      if (debugApi) {
        debugApi.error("forensics inline UI resolve stage failed", {
          message: error && error.message ? error.message : "unknown error"
        });
      }
    }

    // Once the pipeline state is ready, render every output pane from the same normalized item list.
    renderDetected(items);
    renderResolved(items);

    const finalUrls = renderFinal(items);
    const digestEntries = mergedLinkLabPipeline.buildDigestEntries(payload.cleanedText, items);

    renderDigest(digestEntries);
    renderRewrittenHtml(payload.sourceHtml || payload.cleanedText);
    renderDiagnostics(items, finalUrls, digestEntries, errors, payload.rawText);
    if (debugApi) {
      debugApi.pipeline("forensics inline UI pipeline rendered", {
        itemCount: items.length,
        finalUrlCount: finalUrls.length,
        digestEntryCount: digestEntries.length,
        errorCount: errors.length
      });
      debugApi.functionOut("forensics-inline-ui.runPipeline", {
        itemCount: items.length,
        errorCount: errors.length
      });
    }
  }

  // Read the main pane ID associated with a workspace column.
  function getColumnPaneId(column) {
    const pane = column ? column.querySelector(".pane-edit, .pane-output, .pane-console") : null;
    return pane ? pane.id : "";
  }

  // Apply expanded and collapsed CSS classes based on the current UI state.
  function applyColumnExpansionState() {
    DOM.columns.forEach(function updateColumnState(column) {
      const paneId = getColumnPaneId(column);
      const isExpanded = !!paneId && UIState.expandedPaneIds.has(paneId);

      column.classList.toggle("is-expanded", isExpanded);
      column.classList.toggle("is-collapsed-horizontal", !isExpanded);
      column.classList.toggle("is-active", isExpanded);
    });
  }

  // Check whether the converted preview sidebar is currently open.
  function isRewrittenSidebarOpen() {
    return !!(DOM.rewrittenSidebar && DOM.rewrittenSidebar.classList.contains("is-open"));
  }

  // Open or close the converted preview sidebar and sync button text.
  function setRewrittenSidebarOpen(isOpen) {
    if (!DOM.rewrittenSidebar || !DOM.useRewrittenBtn) {
      if (debugApi) {
        debugApi.conditional("forensics inline sidebar visibility skipped: required elements unavailable");
      }
      return;
    }

    DOM.rewrittenSidebar.classList.toggle("is-open", isOpen);
    DOM.rewrittenSidebar.setAttribute("aria-hidden", String(!isOpen));
    DOM.useRewrittenBtn.textContent = isOpen ? "Hide Converted Panel" : "Show Converted Panel";
    if (debugApi) {
      debugApi.ui("forensics inline rewritten sidebar visibility changed", { isOpen: !!isOpen });
    }
  }

  // Close the converted preview sidebar using the shared state helper.
  function closeRewrittenSidebar() {
    setRewrittenSidebarOpen(false);
  }

  // Allow pane headers to control which workspace column is expanded.
  function bindPaneCollapse() {
    DOM.columns.forEach(function bindColumn(column) {
      const title = column.querySelector(".pane-title");

      if (!title) {
        return;
      }

      title.addEventListener("click", function handleTitleClick(event) {
        // Ignore button clicks, skip columns without a pane ID, and keep at least one column expanded at all times.
        if (event.target && event.target.closest("button")) {
          return;
        }

        const paneId = getColumnPaneId(column);
        if (!paneId) {
          return;
        }

        if (UIState.expandedPaneIds.has(paneId) && UIState.expandedPaneIds.size === 1) {
          return;
        }

        UIState.expandedPaneIds.clear();
        UIState.expandedPaneIds.add(paneId);
        applyColumnExpansionState();
      });
    });
  }

  // Copy rich HTML first when possible and fall back to plain text so clipboard support stays broad.
  async function copyElementRichThenPlain(target) {
    if (debugApi) {
      debugApi.functionIn("forensics-inline-ui.copyElementRichThenPlain", {
        targetType: typeof target === "string" ? "id" : "element"
      });
    }
    const copiedRich = await componentKit.copyRichFromElement(target);

    if (!copiedRich) {
      if (debugApi) {
        debugApi.conditional("forensics inline copy falling back to plain text");
      }
      await componentKit.copyFromElement(target);
    }
    if (debugApi) {
      debugApi.ui("forensics inline copy requested", { usedRichText: !!copiedRich });
      debugApi.functionOut("forensics-inline-ui.copyElementRichThenPlain", { copied: true });
    }
  }

  // Event bindings are collected here so startup remains easy to trace and maintain.
  function bindEvents() {
    if (debugApi) {
      debugApi.functionIn("forensics-inline-ui.bindEvents");
    }
    if (DOM.runBtn) {
      DOM.runBtn.addEventListener("click", function handleRunClick() {
        if (debugApi) {
          debugApi.ui("forensics inline run pipeline clicked");
        }
        runPipeline({ writeCleanedInput: true });
      });
    }

    if (DOM.useRewrittenBtn) {
      DOM.useRewrittenBtn.addEventListener("click", function handleSidebarToggle() {
        const willOpen = !isRewrittenSidebarOpen();
        if (debugApi) {
          debugApi.ui("forensics inline rewritten sidebar toggled", { willOpen: willOpen });
        }

        if (willOpen) {
          runPipeline({ writeCleanedInput: false });
        }

        setRewrittenSidebarOpen(willOpen);
      });
    }

    if (DOM.closeRewrittenBtn) {
      DOM.closeRewrittenBtn.addEventListener("click", function handleCloseRewrittenClick() {
        if (debugApi) {
          debugApi.ui("forensics inline rewritten sidebar close clicked");
        }
        closeRewrittenSidebar();
      });
    }

    if (DOM.copyFinalBtn) {
      DOM.copyFinalBtn.addEventListener("click", function handleCopyFinalClick() {
        if (debugApi) {
          debugApi.ui("forensics inline copy final clicked");
        }
        copyElementRichThenPlain(DOM.finalPane);
      });
    }

    if (DOM.copyDigestBtn) {
      DOM.copyDigestBtn.addEventListener("click", function handleCopyDigestClick() {
        if (debugApi) {
          debugApi.ui("forensics inline copy digest clicked");
        }
        copyElementRichThenPlain(DOM.digestPane);
      });
    }

    if (DOM.toggleDebugBtn) {
      DOM.toggleDebugBtn.addEventListener("click", function handleDebugToggleClick() {
        if (debugApi) {
          debugApi.ui("forensics inline legacy debug pane toggled");
        }
        componentKit.toggle(DOM.debugPane);
      });
    }

    document.querySelectorAll("[data-copy]").forEach(function bindCopyButton(button) {
      button.addEventListener("click", function handleCopyClick() {
        const targetId = button.getAttribute("data-copy");
        if (debugApi) {
          debugApi.ui("forensics inline pane copy clicked", { targetId: targetId || "" });
        }
        copyElementRichThenPlain(targetId);
      });
    });

    componentKit.bindLiveInput(DOM.editor, function handleLiveInput() {
      if (debugApi) {
        debugApi.ui("forensics inline editor input changed", {
          isRichMode: isEditorRichMode(),
          textLength: DOM.editor && DOM.editor.innerText ? DOM.editor.innerText.length : 0
        });
      }
      if (isEditorRichMode() && DOM.editor && DOM.editor.dataset) {
        DOM.editor.dataset.sourceHtml = DOM.editor.innerHTML || "";
        if (debugApi) {
          debugApi.variable("forensics inline source html snapshot length assigned", {
            sourceHtmlLength: DOM.editor.dataset.sourceHtml.length
          });
        }
      }

      runPipeline({ writeCleanedInput: false });
    });

    if (DOM.editor) {
      DOM.editor.addEventListener("paste", function handleEditorPaste(event) {
        const clipboardData = event.clipboardData;
        const htmlMarkup = clipboardData ? clipboardData.getData("text/html") : "";

        if (!htmlMarkup) {
          if (debugApi) {
            debugApi.conditional("forensics inline paste skipped rich-html handling: no html markup");
          }
          return;
        }

        if (debugApi) {
          debugApi.ui("forensics inline rich html pasted", { htmlMarkupLength: htmlMarkup.length });
        }
        event.preventDefault();
        setEditorMode("rich-html");
        insertHtmlAtSelection(sanitizeEditorHtml(htmlMarkup));

        if (DOM.editor.dataset) {
          DOM.editor.dataset.sourceHtml = DOM.editor.innerHTML || "";
        }

        runPipeline({ writeCleanedInput: false });
      });
    }

    document.addEventListener("keydown", function handleEscape(event) {
      if (event.key === "Escape") {
        if (debugApi) {
          debugApi.ui("forensics inline escape pressed");
        }
        closeRewrittenSidebar();
      }
    });
    if (debugApi) {
      debugApi.functionOut("forensics-inline-ui.bindEvents", { bound: true });
    }
  }

  // Bootstrap seeds the editor, wires the UI, restores the default layout, and performs the first analysis.
  function bootstrap() {
    if (debugApi) {
      debugApi.functionIn("forensics-inline-ui.bootstrap");
    }
    if (!DOM.editor) {
      if (debugApi) {
        debugApi.error("forensics inline bootstrap aborted: editor unavailable");
        debugApi.functionOut("forensics-inline-ui.bootstrap", { bootstrapped: false });
      }
      return;
    }

    setEditorPlainText(sampleInput);
    bindEvents();
    bindPaneCollapse();
    setRewrittenSidebarOpen(!!(DOM.rewrittenSidebar && DOM.rewrittenSidebar.hasAttribute("data-default-open")));
    applyColumnExpansionState();
    runPipeline({ writeCleanedInput: true });
    if (debugApi) {
      debugApi.runtime("forensics inline UI bootstrap complete", {
        columnCount: DOM.columns.length,
        hasRewrittenSidebar: !!DOM.rewrittenSidebar
      });
      debugApi.functionOut("forensics-inline-ui.bootstrap", { bootstrapped: true });
    }
  }

  bootstrap();
})();
</script>
</body>
</html>
